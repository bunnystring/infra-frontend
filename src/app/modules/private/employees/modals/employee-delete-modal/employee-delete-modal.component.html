<div class="modal modal-open z-50 bg-transparent">
  <div class="modal-box bg-white/90 backdrop-blur-sm border border-error shadow-2xl rounded-xl relative">
    <div class="absolute top-0 right-0 m-4 text-error">
      <svg class="h-7 w-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </div>

    <h3 class="font-bold text-xl mb-6 flex items-center gap-2 text-error">
      <svg class="h-6 w-6 text-error" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      ¿Eliminar empleado?
    </h3>

    <p class="mb-6 text-lg flex items-center gap-2">
      <svg class="h-5 w-5 text-blue-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      ¿Estás seguro de que deseas eliminar a <b class="text-error ml-1">{{ employee()?.fullName }}</b>?
    </p>

    <div class="alert alert-warning mb-4 text-sm flex gap-2 items-center">
      <svg class="h-5 w-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      Esta acción no se puede deshacer. El empleado será eliminado del sistema y se perderán sus asignaciones a grupos.
    </div>

    @if (error()) {
      <div class="alert alert-error font-semibold mb-4 flex gap-2 items-center">
        <svg class="h-5 w-5 text-error" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{ error() }}
      </div>
    }

    @if (loading()) {
      <div class="flex justify-center mb-4">
        <span class="loading loading-spinner loading-lg text-error"></span>
      </div>
    }

    <div class="modal-action flex justify-end gap-4">
      <button class="btn btn-ghost btn-lg" (click)="cancelDelete()" [disabled]="loading()">
        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
        Cancelar
      </button>
      <button class="btn btn-error btn-lg" (click)="confirmDelete()" [disabled]="loading()">
        @if (loading()) {
          <span class="loading loading-spinner loading-xs mr-2"></span>
        }
        <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        Eliminar
      </button>
    </div>
  </div>
</div>
